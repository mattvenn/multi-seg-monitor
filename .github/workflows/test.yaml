name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The FPGA and the default simulation infer an array; the ASIC hardens
        # the IHP macro (src/config.json defines IHP_SRAM). Run both, so neither
        # path can rot unnoticed. SPEC.md section 8.2.
        include:
          - ram: inferred array
            make_args: ""
          - ram: IHP sg13g2 macro
            make_args: "IHP_SRAM=1"
    name: test (${{ matrix.ram }})
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make ${{ matrix.make_args }}
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Run converter tests
        run: cd tools && python3 test_video2seg.py

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ strategy.job-index }}
          path: |
            test/tb.vcd
            test/results.xml
            test/frame.png
            test/frame_stream.png
